name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    # run on github action runner
    name: Lint and test
    runs-on: ubuntu-latest

    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      PYTHON_VERSION: 3.12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for setuptools-scm to read git tags

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure private GitHub access
        run: git config --global url.https://${{ env.GH_PAT }}@github.com/.insteadOf https://github.com/

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Get current package version
        run: python -m setuptools_scm

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Run tests
        run: pytest
